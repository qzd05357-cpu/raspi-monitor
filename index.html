<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>温湿度グラフ（Raspberry Pi DHT11）</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    body {
      background: #1a1a2e;
      color: #e0e0e0;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
      font-size: 1.4em;
      color: #a0c4ff;
      margin-bottom: 8px;
    }
    .subtitle {
      text-align: center;
      font-size: 0.85em;
      color: #888;
      margin-bottom: 20px;
    }
    /* オプションボタン */
    .mode-selector {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 20px;
    }
    .mode-btn {
      padding: 8px 24px;
      border-radius: 20px;
      border: 1px solid #a0c4ff;
      background: transparent;
      color: #a0c4ff;
      cursor: pointer;
      font-size: 0.9em;
      transition: all 0.2s;
    }
    .mode-btn:hover { background: #0f3460; }
    .mode-btn.active {
      background: #a0c4ff;
      color: #1a1a2e;
      font-weight: bold;
    }
    .chart-container {
      background: #16213e;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 24px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }
    .chart-title {
      font-size: 1em;
      font-weight: bold;
      margin-bottom: 14px;
      padding-left: 8px;
      border-left: 4px solid;
    }
    .chart-title.temp { color: #ff7043; border-color: #ff7043; }
    .chart-title.hum  { color: #42a5f5; border-color: #42a5f5; }
    .canvas-wrapper {
      position: relative;
      height: 320px;
    }
    .updated {
      text-align: right;
      font-size: 0.75em;
      color: #666;
      margin-top: 8px;
    }
    .reload-btn {
      display: block;
      margin: 0 auto 20px;
      padding: 10px 32px;
      background: #0f3460;
      color: #a0c4ff;
      border: 1px solid #a0c4ff;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9em;
    }
    .reload-btn:hover { background: #1a5276; }
    #status {
      text-align: center;
      font-size: 0.85em;
      color: #aaa;
      margin-bottom: 16px;
    }
    /* ページタブ */
    .page-tabs {
      display: flex;
      justify-content: center;
      gap: 0;
      margin-bottom: 28px;
    }
    .page-tab {
      padding: 10px 36px;
      background: transparent;
      color: #888;
      border: 1px solid #a0c4ff;
      cursor: pointer;
      font-size: 1em;
      transition: all 0.2s;
    }
    .page-tab:first-child { border-radius: 6px 0 0 6px; }
    .page-tab:last-child  { border-radius: 0 6px 6px 0; }
    .page-tab.active { background: #a0c4ff; color: #1a1a2e; font-weight: bold; }
    .page-tab:hover:not(.active) { background: #0f3460; color: #a0c4ff; }
    /* SwitchBot デバイス色 */
    .chart-title.sw0 { color: #FF6B6B; border-color: #FF6B6B; }
    .chart-title.sw1 { color: #FF9F43; border-color: #FF9F43; }
    .chart-title.sw2 { color: #54A0FF; border-color: #54A0FF; }
    .sw-status { text-align: center; font-size: 0.85em; color: #aaa; margin-bottom: 16px; }
  </style>
</head>
<body>
  <h1>🌡 温湿度モニター</h1>
  <p class="subtitle">自動更新: 10分ごと</p>

  <!-- ページタブ -->
  <div class="page-tabs">
    <button class="page-tab active" id="tab-raspi"     onclick="switchPage('raspi')">🍓 Raspberry Pi</button>
    <button class="page-tab"        id="tab-switchbot" onclick="switchPage('switchbot')">🤖 SwitchBot</button>
    <button class="page-tab"        id="tab-compare"   onclick="switchPage('compare')">📊 比較</button>
  </div>

  <!-- ===== Raspberry Pi セクション ===== -->
  <div id="page-raspi">

  <!-- 表示モード切替 -->
  <div class="mode-selector">
    <button class="mode-btn active" id="btn7d"   onclick="switchMode('7d')">直近7日・1時間平均</button>
    <button class="mode-btn"        id="btn30d"  onclick="switchMode('30d')">直近30日・6時間平均</button>
    <button class="mode-btn"        id="btn90d"  onclick="switchMode('90d')">直近90日・12時間平均</button>
    <button class="mode-btn"        id="btn180d" onclick="switchMode('180d')">直近180日・24時間平均</button>
  </div>

  <button class="reload-btn" onclick="loadData()">🔄 グラフを最新化</button>
  <div id="status">読み込み中...</div>

  <div class="chart-container">
    <div class="chart-title temp">🌡 温度推移（℃）</div>
    <div class="canvas-wrapper"><canvas id="tempChart"></canvas></div>
    <div class="updated" id="tempUpdated"></div>
  </div>

  <div class="chart-container">
    <div class="chart-title hum">💧 湿度推移（%）</div>
    <div class="canvas-wrapper"><canvas id="humChart"></canvas></div>
    <div class="updated" id="humUpdated"></div>
  </div>

  </div><!-- /page-raspi -->

  <!-- ===== SwitchBot セクション ===== -->
  <div id="page-switchbot" style="display:none">

    <!-- 表示モード切替 (SwitchBot) -->
    <div class="mode-selector">
      <button class="mode-btn active" id="sw-btn7d"   onclick="switchSwMode('7d')">直近7日・1時間平均</button>
      <button class="mode-btn"        id="sw-btn30d"  onclick="switchSwMode('30d')">直近30日・6時間平均</button>
      <button class="mode-btn"        id="sw-btn90d"  onclick="switchSwMode('90d')">直近90日・12時間平均</button>
      <button class="mode-btn"        id="sw-btn180d" onclick="switchSwMode('180d')">直近180日・24時間平均</button>
    </div>

    <button class="reload-btn" onclick="loadSwitchBotData()">🔄 グラフを最新化</button>
    <div class="sw-status" id="sw-status">読み込み中...</div>

    <div id="sw-charts"></div>
  </div><!-- /page-switchbot -->

  <!-- ===== 比較セクション ===== -->
  <div id="page-compare" style="display:none">

    <div class="mode-selector">
      <button class="mode-btn active" id="cmp-btn7d"   onclick="switchCmpMode('7d')">直近7日・1時間平均</button>
      <button class="mode-btn"        id="cmp-btn30d"  onclick="switchCmpMode('30d')">直近30日・6時間平均</button>
      <button class="mode-btn"        id="cmp-btn90d"  onclick="switchCmpMode('90d')">直近90日・12時間平均</button>
      <button class="mode-btn"        id="cmp-btn180d" onclick="switchCmpMode('180d')">直近180日・24時間平均</button>
    </div>

    <button class="reload-btn" onclick="loadCmpData()">🔄 グラフを最新化</button>
    <div class="sw-status" id="cmp-status">読み込み中...</div>

    <div class="chart-container">
      <div class="chart-title temp">🌡 温度推移（℃）</div>
      <div class="canvas-wrapper"><canvas id="cmpTempChart"></canvas></div>
    </div>
    <div class="chart-container">
      <div class="chart-title hum">💧 湿度推移（%）</div>
      <div class="canvas-wrapper"><canvas id="cmpHumChart"></canvas></div>
    </div>

  </div><!-- /page-compare -->

  <script>
    const SPREADSHEET_ID = "16iU30vglfkdwiKbNV7LN6-HY4bskH6iHJAtpwlD3SAs";
    // 「1時間平均」シート(gid=317642509)と「シート1」生データ(gid=0)
    const GID_1H  = "317642509";
    const GID_RAW = "0";

    // モード定義: { days: 表示日数, hours: 集計時間単位, gid: データソース }
    const MODES = {
      '7d':   { days:   7, hours:  1, gid: GID_1H,  label: '直近7日・1時間平均' },
      '30d':  { days:  30, hours:  6, gid: GID_RAW, label: '直近30日・6時間平均' },
      '90d':  { days:  90, hours: 12, gid: GID_RAW, label: '直近90日・12時間平均' },
      '180d': { days: 180, hours: 24, gid: GID_RAW, label: '直近180日・24時間平均' },
    };

    let tempChartObj = null;
    let humChartObj  = null;
    let currentMode  = '7d';

    function now() {
      return new Date().toLocaleString('ja-JP');
    }

    function switchMode(mode) {
      currentMode = mode;
      ['7d','30d','90d','180d'].forEach(m => {
        document.getElementById('btn' + m).classList.toggle('active', m === mode);
      });
      loadData();
    }

    function loadData() {
      document.getElementById('status').textContent = '読み込み中...';
      const cfg = MODES[currentMode];
      const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&gid=${cfg.gid}&t=${Date.now()}`;

      fetch(url)
        .then(r => {
          if (!r.ok) throw new Error(`HTTP ${r.status}`);
          return r.text();
        })
        .then(csv => {
          const lines = csv.trim().split('\n');
          const allLabels = [], allTemps = [], allHums = [];
          for (let i = 1; i < lines.length; i++) {
            const cols = lines[i].split(',').map(s => s.replace(/^"|"$/g, '').trim());
            if (cols.length < 3) continue;
            allLabels.push(cols[0]);
            allTemps.push(parseFloat(cols[1]));
            allHums.push(parseFloat(cols[2]));
          }

          let labels, temps, hums;
          const cutoff = new Date();
          cutoff.setDate(cutoff.getDate() - cfg.days);

          if (currentMode === '7d') {
            // 1時間平均シートから直近7日を絞り込み
            labels = []; temps = []; hums = [];
            for (let i = 0; i < allLabels.length; i++) {
              if (new Date(allLabels[i]) >= cutoff) {
                labels.push(allLabels[i]);
                temps.push(allTemps[i]);
                hums.push(allHums[i]);
              }
            }
          } else {
            // 生データから指定時間単位で集計
            const bucket = {};
            for (let i = 0; i < allLabels.length; i++) {
              const dt = new Date(allLabels[i]);
              if (dt < cutoff) continue;
              const hUnit = Math.floor(dt.getHours() / cfg.hours) * cfg.hours;
              const key = `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')} ${String(hUnit).padStart(2,'0')}:00`;
              if (!bucket[key]) bucket[key] = { temp: [], hum: [] };
              bucket[key].temp.push(allTemps[i]);
              bucket[key].hum.push(allHums[i]);
            }
            const sortedKeys = Object.keys(bucket).sort();
            labels = sortedKeys;
            temps  = sortedKeys.map(k => Math.round(bucket[k].temp.reduce((a,b)=>a+b,0) / bucket[k].temp.length * 10) / 10);
            hums   = sortedKeys.map(k => Math.round(bucket[k].hum.reduce((a,b)=>a+b,0)  / bucket[k].hum.length  * 10) / 10);
          }

          renderCharts(labels, temps, hums);
          const t = now();
          document.getElementById('tempUpdated').textContent = `更新: ${t}`;
          document.getElementById('humUpdated').textContent  = `更新: ${t}`;
          document.getElementById('status').textContent = `✅ ${cfg.label} / ${labels.length} 件（最終更新: ${t}）`;
        })
        .catch(err => {
          document.getElementById('status').textContent = `❌ 読み込みエラー: ${err.message}`;
          console.error(err);
        });
    }

    function renderCharts(labels, temps, hums) {
      // X軸ラベルの間引き間隔をモードで調整
      // 7d(~168件):6おき / 30d(~120件):4おき / 90d(~180件):7おき(1日) / 180d(~180件):7おき(1日)
      const stepMap = { '7d': 6, '30d': 4, '90d': 2, '180d': 1 };
      const step = stepMap[currentMode] || 6;
      const tickLabels = labels.map((l, i) => (i % step === 0) ? l.slice(0, 13) : '');

      const commonOptions = {
        responsive: true,
        maintainAspectRatio: false,
        animation: false,
        plugins: { legend: { labels: { color: '#ccc' } } },
        scales: {
          x: {
            ticks: {
              color: '#aaa',
              maxRotation: 45,
              autoSkip: false,
              callback: function(val, i) { return tickLabels[i] || ''; }
            },
            grid: { color: 'rgba(255,255,255,0.05)' }
          },
          y: {
            ticks: { color: '#aaa' },
            grid: { color: 'rgba(255,255,255,0.08)' }
          }
        }
      };

      // 温度グラフ
      if (tempChartObj) tempChartObj.destroy();
      tempChartObj = new Chart(document.getElementById('tempChart'), {
        type: 'line',
        data: {
          labels,
          datasets: [{
            label: '温度 (℃)',
            data: temps,
            borderColor: '#ff7043',
            backgroundColor: 'rgba(255,112,67,0.1)',
            borderWidth: 1.5,
            pointRadius: 0,
            tension: 0.3,
            fill: true,
          }]
        },
        options: {
          ...commonOptions,
          scales: {
            ...commonOptions.scales,
            y: { ...commonOptions.scales.y, title: { display: true, text: '℃', color: '#aaa' } }
          }
        }
      });

      // 湿度グラフ
      if (humChartObj) humChartObj.destroy();
      humChartObj = new Chart(document.getElementById('humChart'), {
        type: 'line',
        data: {
          labels,
          datasets: [{
            label: '湿度 (%)',
            data: hums,
            borderColor: '#42a5f5',
            backgroundColor: 'rgba(66,165,245,0.1)',
            borderWidth: 1.5,
            pointRadius: 0,
            tension: 0.3,
            fill: true,
          }]
        },
        options: {
          ...commonOptions,
          scales: {
            ...commonOptions.scales,
            y: { ...commonOptions.scales.y, title: { display: true, text: '%', color: '#aaa' } }
          }
        }
      });
    }

    // 初回ロード
    loadData();

    // 10分ごとに自動更新
    setInterval(loadData, 10 * 60 * 1000);

    // ===========================================================
    // ページタブ切替
    // ===========================================================
    function switchPage(page) {
      document.getElementById('page-raspi').style.display     = (page === 'raspi')     ? '' : 'none';
      document.getElementById('page-switchbot').style.display = (page === 'switchbot') ? '' : 'none';
      document.getElementById('page-compare').style.display   = (page === 'compare')   ? '' : 'none';
      document.getElementById('tab-raspi').classList.toggle('active',     page === 'raspi');
      document.getElementById('tab-switchbot').classList.toggle('active', page === 'switchbot');
      document.getElementById('tab-compare').classList.toggle('active',   page === 'compare');
      if (page === 'switchbot' && !swLoaded) loadSwitchBotData();
      if (page === 'compare'   && !cmpLoaded) loadCmpData();
    }

    // ===========================================================
    // SwitchBot データ取得・描画
    // ===========================================================
    const SW_SPREADSHEET_ID = "16iU30vglfkdwiKbNV7LN6-HY4bskH6iHJAtpwlD3SAs";
    const SW_DEVICES = [
      { name: "トイレ",   gid: "1917349074", colorT: "#FF6B6B", colorH: "#FF9F8B", cls: "sw0", icon: "🚽" },
      { name: "リビング", gid: "1678891253", colorT: "#FF9F43", colorH: "#FFD0A0", cls: "sw1", icon: "🛋️" },
      { name: "外",       gid: "1925376014", colorT: "#54A0FF", colorH: "#A0D4FF", cls: "sw2", icon: "🌿" },
    ];
    const SW_MODES = {
      '7d':   { days:   7, hours:  1, label: '直近7日・1時間平均' },
      '30d':  { days:  30, hours:  6, label: '直近30日・6時間平均' },
      '90d':  { days:  90, hours: 12, label: '直近90日・12時間平均' },
      '180d': { days: 180, hours: 24, label: '直近180日・24時間平均' },
    };
    let swCurrentMode = '7d';
    let swLoaded = false;
    const swCharts = {};

    function switchSwMode(mode) {
      swCurrentMode = mode;
      ['7d','30d','90d','180d'].forEach(m => {
        document.getElementById('sw-btn' + m).classList.toggle('active', m === mode);
      });
      loadSwitchBotData();
    }

    function buildSwDom() {
      const container = document.getElementById('sw-charts');
      if (container.children.length > 0) return;  // 既に生成済み
      SW_DEVICES.forEach((dev, idx) => {
        const section = document.createElement('div');
        section.id = `sw-section-${idx}`;
        section.innerHTML = `
          <h2 style="text-align:center;color:#a0c4ff;margin:24px 0 12px">${dev.icon} ${dev.name}</h2>
          <div class="chart-container">
            <div class="chart-title ${dev.cls}">🌡 温度推移（℃）</div>
            <div class="canvas-wrapper"><canvas id="sw-temp-${idx}"></canvas></div>
          </div>
          <div class="chart-container">
            <div class="chart-title ${dev.cls}">💧 湿度推移（%）</div>
            <div class="canvas-wrapper"><canvas id="sw-hum-${idx}"></canvas></div>
          </div>`;
        container.appendChild(section);
      });
    }

    function loadSwitchBotData() {
      document.getElementById('sw-status').textContent = '読み込み中...';
      buildSwDom();  // DOM を先に全デバイス分作成（順序固定）

      const cfg = SW_MODES[swCurrentMode];
      const cutoff = new Date();
      cutoff.setDate(cutoff.getDate() - cfg.days);
      let completed = 0;
      let totalCount = 0;

      SW_DEVICES.forEach((dev, idx) => {
        const url = `https://docs.google.com/spreadsheets/d/${SW_SPREADSHEET_ID}/gviz/tq?tqx=out:csv&gid=${dev.gid}&t=${Date.now()}`;
        fetch(url)
          .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.text(); })
          .then(csv => {
            const lines = csv.trim().split('\n');
            const bucket = {};
            for (let i = 1; i < lines.length; i++) {
              const cols = lines[i].split(',').map(s => s.replace(/^"|"$/g, '').trim());
              if (cols.length < 3) continue;
              // Safari は "YYYY-MM-DD HH:MM:SS" を Invalid Date にするため T区切りに変換
              const dt = new Date(cols[0].replace(' ', 'T'));
              if (isNaN(dt) || dt < cutoff) continue;
              const hUnit = Math.floor(dt.getHours() / cfg.hours) * cfg.hours;
              const key = `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')} ${String(hUnit).padStart(2,'0')}:00`;
              if (!bucket[key]) bucket[key] = { t: [], h: [] };
              bucket[key].t.push(parseFloat(cols[1]));
              bucket[key].h.push(parseFloat(cols[2]));
            }
            const sortedKeys = Object.keys(bucket).sort();
            const labels = sortedKeys;
            const temps  = sortedKeys.map(k => +(bucket[k].t.reduce((a,v)=>a+v,0)/bucket[k].t.length).toFixed(1));
            const hums   = sortedKeys.map(k => +(bucket[k].h.reduce((a,v)=>a+v,0)/bucket[k].h.length).toFixed(1));

            totalCount += labels.length;
            renderSwChart(dev, idx, labels, temps, hums);
            completed++;
            if (completed === SW_DEVICES.length) {
              document.getElementById('sw-status').textContent =
                `✅ ${cfg.label} / ${Math.round(totalCount / SW_DEVICES.length)} 件（最終更新: ${new Date().toLocaleString('ja-JP')}）`;
              swLoaded = true;
            }
          })
          .catch(err => {
            document.getElementById('sw-status').textContent = `❌ 読み込みエラー (${dev.name}): ${err.message}`;
          });
      });
    }

    function renderSwChart(dev, idx, labels, temps, hums) {
      const n = labels.length;
      const tickStep = n <= 24 ? 1 : Math.floor(n / 24);
      // "2026-05-24 12:00" → "5/24 12:00" に整形
      const formatTick = (l) => {
        const m = l.match(/\d{4}-(\d{2})-(\d{2}) (\d{2}):(\d{2})/);
        if (!m) return l;
        return `${parseInt(m[1])}/${parseInt(m[2])} ${m[3]}:${m[4]}`;
      };
      const tickLabels = labels.map((l, i) => (i % tickStep === 0) ? formatTick(l) : '');
      const ptRadius = n <= 12 ? 3 : 0;  // データ少量時は点を表示

      const commonOpts = {
        responsive: true, maintainAspectRatio: false, animation: false,
        plugins: { legend: { labels: { color: '#ccc' } } },
        scales: {
          x: { ticks: { color: '#aaa', maxRotation: 45, autoSkip: false,
                         callback: (v, i) => tickLabels[i] || '' },
               grid: { color: 'rgba(255,255,255,0.05)' } },
          y: { ticks: { color: '#aaa' }, grid: { color: 'rgba(255,255,255,0.08)' } }
        }
      };

      if (swCharts[idx]?.temp) swCharts[idx].temp.destroy();
      if (swCharts[idx]?.hum)  swCharts[idx].hum.destroy();
      if (!swCharts[idx]) swCharts[idx] = {};

      swCharts[idx].temp = new Chart(document.getElementById(`sw-temp-${idx}`), {
        type: 'line',
        data: { labels, datasets: [{ label: `${dev.name} 温度 (℃)`, data: temps,
          borderColor: dev.colorT, backgroundColor: dev.colorT+'22',
          borderWidth: 1.5, pointRadius: ptRadius, tension: 0.3, fill: true }] },
        options: { ...commonOpts, scales: { ...commonOpts.scales,
          y: { ...commonOpts.scales.y, title: { display: true, text: '℃', color: '#aaa' } } } }
      });

      swCharts[idx].hum = new Chart(document.getElementById(`sw-hum-${idx}`), {
        type: 'line',
        data: { labels, datasets: [{ label: `${dev.name} 湿度 (%)`, data: hums,
          borderColor: dev.colorH, backgroundColor: dev.colorH+'22',
          borderWidth: 1.5, pointRadius: ptRadius, tension: 0.3, fill: true }] },
        options: { ...commonOpts, scales: { ...commonOpts.scales,
          y: { ...commonOpts.scales.y, title: { display: true, text: '%', color: '#aaa' } } } }
      });
    }

    // 5分ごとにSwitchBotも自動更新（タブ表示中のみ）
    setInterval(() => {
      if (document.getElementById('page-switchbot').style.display !== 'none') {
        loadSwitchBotData();
      }
    }, 5 * 60 * 1000);

    // ===========================================================
    // 比較タブ（Raspi + SwitchBot 3台 を1グラフに重ね表示）
    // ===========================================================
    const CMP_MODES = {
      '7d':   { days:   7, hours:  1, label: '直近7日・1時間平均',    raspiGid: GID_1H  },
      '30d':  { days:  30, hours:  6, label: '直近30日・6時間平均',   raspiGid: GID_RAW },
      '90d':  { days:  90, hours: 12, label: '直近90日・12時間平均',  raspiGid: GID_RAW },
      '180d': { days: 180, hours: 24, label: '直近180日・24時間平均', raspiGid: GID_RAW },
    };

    const CMP_SOURCES = [
      { name: 'Raspi',    isRaspi: true,  gid: null,          colorT: '#a0c4ff', colorH: '#5bc5fa' },
      { name: 'トイレ',   isRaspi: false, gid: '1917349074',  colorT: '#FF6B6B', colorH: '#FF9F8B' },
      { name: 'リビング', isRaspi: false, gid: '1678891253',  colorT: '#FF9F43', colorH: '#FFD0A0' },
      { name: '外',       isRaspi: false, gid: '1925376014',  colorT: '#54A0FF', colorH: '#A0D4FF' },
    ];

    let cmpCurrentMode = '7d';
    let cmpLoaded = false;
    let cmpTempChart = null;
    let cmpHumChart  = null;

    function switchCmpMode(mode) {
      cmpCurrentMode = mode;
      ['7d','30d','90d','180d'].forEach(m => {
        document.getElementById('cmp-btn' + m).classList.toggle('active', m === mode);
      });
      loadCmpData();
    }

    function loadCmpData() {
      document.getElementById('cmp-status').textContent = '読み込み中...';
      const cfg    = CMP_MODES[cmpCurrentMode];
      const cutoff = new Date();
      cutoff.setDate(cutoff.getDate() - cfg.days);

      const promises = CMP_SOURCES.map(src => {
        const gid = src.isRaspi ? cfg.raspiGid : src.gid;
        const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&gid=${gid}&t=${Date.now()}`;
        return fetch(url)
          .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.text(); })
          .then(csv => {
            const lines = csv.trim().split('\n');
            const raw = {};
            for (let i = 1; i < lines.length; i++) {
              const cols = lines[i].split(',').map(s => s.replace(/^"|"$/g, '').trim());
              if (cols.length < 3) continue;
              const dt = new Date(cols[0].replace(' ', 'T'));
              if (isNaN(dt) || dt < cutoff) continue;
              const hUnit = Math.floor(dt.getHours() / cfg.hours) * cfg.hours;
              const key = `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')} ${String(hUnit).padStart(2,'0')}:00`;
              if (!raw[key]) raw[key] = { t: [], h: [] };
              raw[key].t.push(parseFloat(cols[1]));
              raw[key].h.push(parseFloat(cols[2]));
            }
            const result = {};
            for (const k of Object.keys(raw)) {
              result[k] = {
                t: +(raw[k].t.reduce((a,v)=>a+v,0) / raw[k].t.length).toFixed(1),
                h: +(raw[k].h.reduce((a,v)=>a+v,0) / raw[k].h.length).toFixed(1),
              };
            }
            return result;
          });
      });

      Promise.all(promises)
        .then(buckets => {
          // 全ソースの時刻キーを統合してソート
          const allKeys = new Set();
          buckets.forEach(b => Object.keys(b).forEach(k => allKeys.add(k)));
          const labels = Array.from(allKeys).sort();

          const tempDatasets = CMP_SOURCES.map((src, i) => ({
            label: src.name + ' 温度',
            data: labels.map(k => (buckets[i][k] !== undefined ? buckets[i][k].t : null)),
            borderColor: src.colorT,
            backgroundColor: src.colorT + '22',
            borderWidth: 1.5, pointRadius: 0, tension: 0.3, fill: false, spanGaps: false,
          }));

          const humDatasets = CMP_SOURCES.map((src, i) => ({
            label: src.name + ' 湿度',
            data: labels.map(k => (buckets[i][k] !== undefined ? buckets[i][k].h : null)),
            borderColor: src.colorH,
            backgroundColor: src.colorH + '22',
            borderWidth: 1.5, pointRadius: 0, tension: 0.3, fill: false, spanGaps: false,
          }));

          renderCmpCharts(labels, tempDatasets, humDatasets);
          document.getElementById('cmp-status').textContent =
            `✅ ${cfg.label} / ${labels.length} 件（最終更新: ${new Date().toLocaleString('ja-JP')}）`;
          cmpLoaded = true;
        })
        .catch(err => {
          document.getElementById('cmp-status').textContent = `❌ 読み込みエラー: ${err.message}`;
        });
    }

    function renderCmpCharts(labels, tempDatasets, humDatasets) {
      const n = labels.length;
      const tickStep = n <= 24 ? 1 : Math.floor(n / 24);
      const formatTick = (l) => {
        const m = l.match(/\d{4}-(\d{2})-(\d{2}) (\d{2}):(\d{2})/);
        if (!m) return l;
        return `${parseInt(m[1])}/${parseInt(m[2])} ${m[3]}:${m[4]}`;
      };
      const tickLabels = labels.map((l, i) => (i % tickStep === 0) ? formatTick(l) : '');

      const commonOpts = {
        responsive: true, maintainAspectRatio: false, animation: false,
        plugins: { legend: { labels: { color: '#ccc' } } },
        scales: {
          x: { ticks: { color: '#aaa', maxRotation: 45, autoSkip: false,
                         callback: (v, i) => tickLabels[i] || '' },
               grid: { color: 'rgba(255,255,255,0.05)' } },
          y: { ticks: { color: '#aaa' }, grid: { color: 'rgba(255,255,255,0.08)' } }
        }
      };

      if (cmpTempChart) cmpTempChart.destroy();
      cmpTempChart = new Chart(document.getElementById('cmpTempChart'), {
        type: 'line',
        data: { labels, datasets: tempDatasets },
        options: { ...commonOpts, scales: { ...commonOpts.scales,
          y: { ...commonOpts.scales.y, title: { display: true, text: '℃', color: '#aaa' } } } }
      });

      if (cmpHumChart) cmpHumChart.destroy();
      cmpHumChart = new Chart(document.getElementById('cmpHumChart'), {
        type: 'line',
        data: { labels, datasets: humDatasets },
        options: { ...commonOpts, scales: { ...commonOpts.scales,
          y: { ...commonOpts.scales.y, title: { display: true, text: '%', color: '#aaa' } } } }
      });
    }

    // 10分ごとに比較タブも自動更新（タブ表示中のみ）
    setInterval(() => {
      if (document.getElementById('page-compare').style.display !== 'none') {
        loadCmpData();
      }
    }, 10 * 60 * 1000);
  </script>
</body>
